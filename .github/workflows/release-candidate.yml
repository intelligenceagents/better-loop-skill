name: Prepare local release candidate
on:
  workflow_dispatch:
    inputs:
      candidate_label:
        description: Review label only; does not change source versions or create a tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: npm install --global npm@10.9.0
      - run: python -m pip install -r requirements-dev.txt
      # Populate npm's cache; the isolated source build installs offline.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare and check exact source candidate
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
        run: node tools/prepare-release-candidate.mjs --output "$RUNNER_TEMP/release-candidate" --label "$CANDIDATE_LABEL"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 14
